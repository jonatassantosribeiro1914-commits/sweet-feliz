<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420">
  <!-- Papel de parede natalino: traço único fino, dourado-acinzentado, bem espaçado. Ladrilho de 420 px. -->
  <g fill="none" stroke="#A88B62" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity=".42">

    <!-- floco de neve -->
    <g transform="translate(58 60) rotate(8)">
      <path d="M0 -16 V16 M-13.9 -8 L13.9 8 M-13.9 8 L13.9 -8"/>
      <path d="M-4 -12 L0 -8 L4 -12 M-4 12 L0 8 L4 12 M-14 -2 L-9 -4 L-11.5 -9 M14 2 L9 4 L11.5 9 M-11.5 9 L-9 4 L-14 2 M11.5 -9 L9 -4 L14 -2"/>
    </g>

    <!-- ramo de pinheiro -->
    <g transform="translate(232 70) rotate(-24)">
      <path d="M-22 0 H24"/>
      <path d="M-16 0 L-10 -7 M-16 0 L-10 7 M-6 0 L0 -8 M-6 0 L0 8 M4 0 L10 -8 M4 0 L10 8 M14 0 L19 -6 M14 0 L19 6"/>
    </g>

    <!-- estrela de 4 pontas -->
    <path transform="translate(362 150)" d="M0 -12 C1 -3 3 -1 12 0 C3 1 1 3 0 12 C-1 3 -3 1 -12 0 C-3 -1 -1 -3 0 -12 Z"/>

    <!-- bolinha de árvore -->
    <g transform="translate(118 190) rotate(-6)">
      <path d="M0 -22 C-3 -18 3 -15 0 -12"/>
      <rect x="-4" y="-12" width="8" height="4" rx="1"/>
      <circle cx="0" cy="3" r="11"/>
      <path d="M-10 1 Q0 6 10 1" opacity=".7"/>
    </g>

    <!-- sino -->
    <g transform="translate(300 262) rotate(10)">
      <path d="M-11 8 C-9 4 -9 -2 -8 -6 A8 8 0 0 1 8 -6 C9 -2 9 4 11 8 Z"/>
      <path d="M-3 11.5 A3 3 0 0 0 3 11.5 M0 -14 V-11"/>
      <path d="M2 -14 C6 -18 12 -16 10 -12" opacity=".7"/>
    </g>

    <!-- azevinho -->
    <g transform="translate(66 330) rotate(-14)">
      <path d="M0 0 C-6 -4 -12 -2 -18 -8 C-14 -2 -16 2 -12 4 C-8 2 -4 4 0 0 Z"/>
      <path d="M0 0 C6 -4 12 -2 18 -8 C14 -2 16 2 12 4 C8 2 4 4 0 0 Z"/>
      <circle cx="-2.6" cy="4.5" r="2.4"/><circle cx="2.6" cy="4.5" r="2.4"/>
    </g>

    <!-- floco pequeno -->
    <g transform="translate(206 356) rotate(18)">
      <path d="M0 -9 V9 M-7.8 -4.5 L7.8 4.5 M-7.8 4.5 L7.8 -4.5"/>
    </g>

    <!-- estrelinha -->
    <path transform="translate(380 380)" d="M0 -7 C.6 -2 2 -.6 7 0 C2 .6 .6 2 0 7 C-.6 2 -2 .6 -7 0 C-2 -.6 -.6 -2 0 -7 Z"/>

    <!-- pontinhos de neve -->
    <g fill="#A88B62" stroke="none">
      <circle cx="150" cy="40" r="1.4"/><circle cx="330" cy="40" r="1.2"/><circle cx="20" cy="140" r="1.2"/>
      <circle cx="250" cy="170" r="1.4"/><circle cx="190" cy="270" r="1.2"/><circle cx="380" cy="300" r="1.2"/>
      <circle cx="130" cy="400" r="1.4"/><circle cx="300" cy="380" r="1.2"/>
    </g>
  </g>
</svg>
